name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android SDK
        run: |
          set -o pipefail
          exec > >(tee build.log) 2>&1
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Android SDK root: $SDK"
          ls "$SDK" || true
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
          } >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses 2>&1 | tail -3 || true
            "$SM" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tail -10 || true
          else
            echo "sdkmanager missing, letting AGP download what it needs"
          fi

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee -a build.log

      - name: Build release APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --console=plain --stacktrace 2>&1 | tee -a build.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flashlaunch-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: flashlaunch-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Publish build log as commit comment (on failure)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f build.log ]; then echo "(no build.log was produced)" > build.log; fi
          {
            echo "### Build failed: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo "#### Compiler errors"
            echo '```'
            grep -E "^e: |error: " build.log | head -80 || true
            echo '```'
            echo "#### Gradle failure"
            echo '```'
            grep -A 20 -E "^\\* What went wrong" build.log | head -40 || true
            echo '```'
            echo "#### Tail"
            echo '```'
            tail -c 1200 build.log
            echo '```'
          } > comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.md || true
