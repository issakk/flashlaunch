name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee build.log

      - name: Build release APK (unsigned, R8 check)
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --console=plain --stacktrace 2>&1 | tee -a build.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flashlaunch-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: flashlaunch-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Publish build log as commit comment (on failure)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 7000 build.log > tail.log 2>/dev/null || echo "no build.log" > tail.log
          {
            echo "### Build failed: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo '```'
            cat tail.log
            echo '```'
          } > comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.md || true
